name: Bug report
description: Something isn't working the way you expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, and what did repolens do?
      placeholder: |
        I ran `repolens --min-score 90` on a repo that has a README and it...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: repolens version
      description: Output of `repolens --version`
      placeholder: repolens 0.3.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
